services:
  sqlserver:
    build: sqlserver
    image: learning:sqlserver
    container_name: learning-sqlserver
    ports:
      - "1477:1433"
    environment:
      MSSQL_SA_PASSWORD: Forever21!
      ACCEPT_EULA: Y
    volumes:
      - .:/usr/local/src

  oracle:
    build: oracle
    image: learning:oracle
    container_name: learning-oracle
    ports:
      - "1521:1521"
    environment:
      MSSQL_SA_PASSWORD: Forever21!
      ACCEPT_EULA: Y
      CONNECTION: system/oracle@localhost
    volumes:
      - .:/usr/local/src

  postgresql:
    build: postgresql-primary
    image: learning:postgresql
    container_name: learning-postgresql
    ports:
      - 2345:5432
    environment:
      - POSTGRES_DB=exploration
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=dev
    volumes:
      - .:/usr/local/src

  postgres-read:
    build: postgresql-standby
    image: learning:postgresql-standby
    container_name: learning-postgres-read
    depends_on:
      - postgresql
    ports:
      - 2346:5432
    volumes:
      - .:/usr/local/src

  mysql:
    build: mysql
    image: learning:mysql
    container_name: learning-mysql
    ports:
      - 3306:3306
    environment:
      - MYSQL_DATABASE=exploration
      - MYSQL_USER=dev
      - MYSQL_PASSWORD=dev
      - MYSQL_ROOT_PASSWORD=dev
    volumes:
      - .:/usr/local/src
